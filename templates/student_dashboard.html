<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard - AdminNova</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="dashboard">

        <div class="dashboard-header">
            <h1>AdminNova</h1>
            <p>Student Dashboard</p>
        </div>

        <div class="dashboard-content">

            <h2>Welcome, {{ username }}</h2>

            <p>
                Manage and track your college administrative requests
                from one place.
            </p>

            <div class="dashboard-cards">

                <div class="dashboard-card">
                    <h3>New Request</h3>
                    <p>Submit a new administrative request.</p>
                    <button>Submit Request</button>
                </div>

                <div class="dashboard-card">
                    <h3>My Requests</h3>
                    <p>View and track your submitted requests.</p>
                    <button>View Requests</button>
                </div>

                <div class="dashboard-card">
                    <h3>Notifications</h3>
                    <p>Check updates regarding your requests.</p>
                    <button>View Notifications</button>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
